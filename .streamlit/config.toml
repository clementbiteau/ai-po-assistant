# Editorial, restrained palette: warm paper, ink, one deep-green accent.
# Chart colours are defined in ui/style.py (validated for both themes).

[theme]
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&display=swap"
headingFontWeights = 500
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
baseRadius = "0.5rem"

[theme.light]
primaryColor = "#1F6E57"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F2F0EA"
textColor = "#1C1B19"
borderColor = "#E4E0D7"
linkColor = "#1F6E57"
redColor = "#B3452C"
orangeColor = "#B87612"
yellowColor = "#A8841C"
greenColor = "#2F9477"
blueColor = "#4271C8"
violetColor = "#6B5CA8"
grayColor = "#8A867D"
chartCategoricalColors = ["#228E6F", "#4271C8", "#B87612"]

[theme.light.sidebar]
backgroundColor = "#F4F2EC"

[theme.dark]
primaryColor = "#4FA98B"
backgroundColor = "#151513"
secondaryBackgroundColor = "#1F1E1B"
textColor = "#ECE8DF"
borderColor = "#2F2D29"
linkColor = "#6FBFA3"
redColor = "#D06A52"
orangeColor = "#CF8F2E"
yellowColor = "#C9A43F"
greenColor = "#4FA98B"
blueColor = "#6A8FD8"
violetColor = "#9A8CD6"
grayColor = "#8A867D"
chartCategoricalColors = ["#228E6F", "#4271C8", "#B87612"]

[theme.dark.sidebar]
backgroundColor = "#1A1A17"

[client]
# "viewer" keeps the main menu (with the native Light/Dark switcher driven by
# the in-app toggle) while hiding developer options.
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
