# Thiga palette (relevée sur thiga.co) : indigo #1B0442, framboise #C50041,
# bordeaux #5E0028, violet #5818FF, crème #FFFCF9 / #F7F3EF. Titres en Kanit,
# texte en Inter. Les couleurs des graphiques sont dans ui/style.py (validées
# daltonisme + contraste sur les deux thèmes).

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Kanit:https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap"
headingFontWeights = 500
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.6rem"

[theme.light]
# Fond crème moins éblouissant que le blanc, texte quasi noir, bordures visibles.
primaryColor = "#C50041"
backgroundColor = "#F2ECE5"
secondaryBackgroundColor = "#FFFCF9"
textColor = "#141019"
borderColor = "#D5CAC0"
linkColor = "#5E0028"
redColor = "#B3261E"
orangeColor = "#B7791F"
yellowColor = "#9C7A12"
greenColor = "#2E7D5B"
blueColor = "#3F4FB8"
violetColor = "#5818FF"
grayColor = "#6E6878"
chartCategoricalColors = ["#6236F0", "#D01452", "#B7790E"]

[theme.light.sidebar]
backgroundColor = "#1B0442"
secondaryBackgroundColor = "#2A1561"
textColor = "#FFFCF9"
borderColor = "#3E2A7A"
primaryColor = "#FF4F87"
linkColor = "#E6DEFA"

[theme.dark]
primaryColor = "#E23A74"
backgroundColor = "#120B22"
secondaryBackgroundColor = "#1E1535"
textColor = "#F4EFF8"
borderColor = "#362B55"
linkColor = "#B6A6FF"
redColor = "#E5534B"
orangeColor = "#D99A3A"
yellowColor = "#D6B24A"
greenColor = "#4CAF84"
blueColor = "#8C9CFF"
violetColor = "#B6A6FF"
grayColor = "#9A93A8"
chartCategoricalColors = ["#6236F0", "#D01452", "#B7790E"]

[theme.dark.sidebar]
backgroundColor = "#1B0442"
secondaryBackgroundColor = "#2A1561"
textColor = "#FFFCF9"
borderColor = "#3E2A7A"
primaryColor = "#FF4F87"
linkColor = "#E6DEFA"

[client]
# "viewer" keeps the main menu (with the native Light/Dark switcher driven by
# the in-app toggle) while hiding developer options.
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
