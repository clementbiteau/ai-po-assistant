[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.6rem"

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7FB"
textColor = "#111827"
borderColor = "#E5E7EB"
chartCategoricalColors = ["#6366F1", "#0EA5E9", "#F59E0B", "#DC2626", "#9CA3AF"]

[theme.light.sidebar]
backgroundColor = "#F6F7FB"

[theme.dark]
primaryColor = "#818CF8"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#151B2B"
textColor = "#E5E7EB"
borderColor = "#262E42"
chartCategoricalColors = ["#818CF8", "#38BDF8", "#FBBF24", "#F87171", "#9CA3AF"]

[theme.dark.sidebar]
backgroundColor = "#10152A"

[client]
# "viewer" keeps the main menu (with the native Light/Dark switcher driven by
# the in-app toggle) while hiding developer options.
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
